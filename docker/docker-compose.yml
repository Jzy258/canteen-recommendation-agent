# 部署编排：frontend + backend + ollama + mcp-weather
# B 负责 ollama 服务部分（模型挂载卷避免重复下载）
# C 负责 frontend 服务（nginx 托管 Vue 构建产物，/api 反代 backend）
# 启动：docker compose -f docker/docker-compose.yml up -d --build
services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE: /api
    container_name: canteen-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - canteen-net

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: canteen-backend
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b
      - DB_PATH=/app/backend/data/canteen.db
      - CHROMA_DB_PATH=/app/backend/data/chroma_db
    volumes:
      - canteen-data:/app/backend/data
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    networks:
      - canteen-net

  ollama:
    image: ollama/ollama:latest
    container_name: canteen-ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    # 启动后拉取支持 function calling 的模型（首次较慢，之后走缓存卷）
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull qwen2.5:7b || true
        wait
    networks:
      - canteen-net

  mcp-weather:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: canteen-mcp-weather
    command: ["python", "backend/mcp/weather_server.py"]
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - WEATHER_BASE_URL=${WEATHER_BASE_URL:-https://restapi.amap.com/v3/weather/weatherInfo}
      - GEOCODE_BASE_URL=${GEOCODE_BASE_URL:-https://restapi.amap.com/v3/geocode/geo}
    depends_on:
      - backend
    networks:
      - canteen-net

volumes:
  canteen-data:
  ollama-models:

networks:
  canteen-net:
    driver: bridge