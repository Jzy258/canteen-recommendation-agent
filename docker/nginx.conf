# nginx 配置（C 负责 · 托管前端构建产物 + 反向代理后端）
# SPA 路由回退 + /api 代理到 backend:8000（去掉 /api 前缀）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # API 反向代理到后端（保留 /api 前缀但转发时去掉）
    # SSE 流式（/chat/stream）需要关闭代理缓冲，否则前端收不到增量
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # SPA 路由回退：刷新 /trend、/profile 等不返回 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
